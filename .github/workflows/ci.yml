name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the release-only job (Node 24). The release train accepts a successful run of this on the exact commit.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b # v7.0.0
        with:
          node-version: '22'

      # The required build and tests use the untouched declared public ranges.
      # The development mirror is available only under first-publication approval.
      - name: Install the public registry closure
        id: public
        uses: ezclassify/.github/actions/public-npm-dependencies@824b115347abe85905c8b68b2d12f0cf214c5202
        with:
          first-publication-packages: ${{ github.repository == 'ezclassify/sdk-js' && vars.EZ_FIRST_PUBLICATION_PACKAGES || '' }}

      - name: Configure the first-publication mirror
        if: steps.public.outputs.lane == 'bootstrap'
        run: |
          cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
          @ezclassify:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

      - name: Resolve declared Contracts dependency
        id: upstream
        if: steps.public.outputs.lane == 'bootstrap' && github.event_name == 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        uses: ezclassify/.github/actions/check-pr-dependencies@7c63d5b73824a37ed06730f43d3c056d19786f7d
        with:
          producer: ezclassify/contracts
          packages: '@ezclassify/types @ezclassify/tsconfig @ezclassify/openapi @ezclassify/conformance @ezclassify/conformance-server'
          publication-app-id: '5819382'
          token: ${{ github.token }}

      # The lockfile is not committed (.gitignore), so the install resolves one
      # from an empty tree and proves those exact bytes with npm ci.
      #
      # Only the @ezclassify scope is routed to the mirror. Third-party
      # packages still come from npmjs, and the installed dependency gate below
      # holds the line on which first-party names may arrive.
      #
      # deps:relock resolves third-party packages only from versions at least
      # seven days old, resolves the first-party ones with `--tag=dev`, the tag
      # the mirror publishes every build under, and then runs the portability
      # and dependency-age checks itself.
      - name: Install the first-publication closure
        if: steps.public.outputs.lane == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        uses: ezclassify/.github/actions/install-node-dependencies@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          mode: generated
          relock-installs: 'false'

      - name: No proprietary dependency crept in
        # The one invariant this repository cannot afford to lose. Public code
        # never resolves a private package, in any dependency section. Checked
        # against every package in the installed tree, not the manifest or just
        # the root node_modules scope, so a nested transitive arrival fails too.
        #
        # Every name in ALLOWED is published Apache-2.0 out of the public
        # contracts repository, and each is listed with the reason it is here:
        #
        #   types               the contract types the emitted .d.ts re-export
        #   tsconfig            the shared compiler settings
        #   conformance         the golden wire corpus every EzClassify SDK
        #                       replays
        #   conformance-server  the replay server for that corpus
        #   openapi             the wire types the tests check against, and
        #                       the contract the replay server validates a
        #                       request against
        #
        # Names are matched whole and spelled out one at a time in the script.
        # A pattern would admit an unrelated package on a shared prefix.
        env:
          CONTRACTS_MIRROR: ${{ steps.upstream.outputs.version }}
        run: node scripts/check-installed-public-deps.mjs

      - name: Format check
        run: npm run format:check

      # Both rules in eslint.config.mjs are errors, so this step can go red.
      # It is the only automated check on the `any`-free and no-unused-binding
      # rules STANDARDS.md states. A test file that needs `any` says so at the
      # top of the file rather than turning the rule back down for everyone.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Builds first: tests/first-app.spec.ts resolves @ezclassify/rest-client
      # by name, and its exports point into dist.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The wire corpus again, this time over a socket. `npm test` replays it
      # through a transport stub in process, which cannot see what a real HTTP
      # round trip does to header casing, query parsing, or a status the
      # platform fetch surfaces differently. This lane is the only place that
      # is checked. It is its own script because it binds a port.
      - name: Conformance server (wire corpus over HTTP)
        run: npm run test:conformance-server

      # package.json declares `prepublishOnly: npm run verify:publish-ready`,
      # and npm will not run it here: .npmrc sets `ignore-scripts=true`, which
      # suppresses npm's own lifecycle hooks along with dependencies'. So the
      # steps above run the verification explicitly, and this one covers the
      # half they do not. The declaration stays because publish tooling runs
      # it with `npm run`; tests/publish-lifecycle.spec.ts holds the line.
      - name: Publish-readiness (pack)
        run: npm pack --dry-run

      # deps:relock rewrites package.json and restores it, and the generators
      # write ignored sources. A tracked change or a new unignored file here
      # means one of those leaked into the tree.
      - name: Clean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo 'The build changed tracked files or left new ones.' >&2
            exit 1
          fi

  # Release only. Nothing else in this repository runs on a second Node major,
  # so this is where the supported range is exercised. The release train accepts
  # a workflow_dispatch run of this workflow with full=true on the exact commit.
  full:
    name: full
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b # v7.0.0
        with:
          node-version: '24'

      - name: Install the public registry closure
        id: public
        uses: ezclassify/.github/actions/public-npm-dependencies@824b115347abe85905c8b68b2d12f0cf214c5202
        with:
          first-publication-packages: ${{ github.repository == 'ezclassify/sdk-js' && vars.EZ_FIRST_PUBLICATION_PACKAGES || '' }}

      - name: Configure the first-publication mirror
        if: steps.public.outputs.lane == 'bootstrap'
        run: |
          cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
          @ezclassify:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

      - name: Install the first-publication closure
        if: steps.public.outputs.lane == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        uses: ezclassify/.github/actions/install-node-dependencies@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          mode: generated
          relock-installs: 'false'

      - name: Typecheck
        run: npm run typecheck

      # Builds first: tests/first-app.spec.ts resolves @ezclassify/rest-client
      # by name, and its exports point into dist.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Conformance server (wire corpus over HTTP)
        run: npm run test:conformance-server

      - name: Publish-readiness (pack)
        run: npm pack --dry-run
